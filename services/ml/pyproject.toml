[project]
name = "rag-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "fpdf2>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
